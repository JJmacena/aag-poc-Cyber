[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aag-be"
version = "1.0.0"
description = "AAG Behavioral Engine - Triple-layer detection for AI-driven offensive agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "httpx==0.26.0",
    "river>=0.26.0",
    "numpy>=2.0.0",
    "torch>=2.15.0",
    "pyarrow>=18.0.0",
    "pandas>=3.0.0",
    "scikit-learn>=1.5.0",
    "clickhouse-driver==0.2.6",
    "kafka-python==2.0.2",
    "redis==5.0.1",
    "psycopg2-binary>=2.9.9",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "ruff==0.1.16",
    "mypy==1.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aag_be*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true