version: '3.8'

services:
  # ─── Behavioral Engine ───
  behavioral-engine:
    build:
      context: ./behavioral-engine
      dockerfile: Dockerfile
    container_name: aag-behavioral-engine
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - CLICKHOUSE_HOST=clickhouse
      - KAFKA_BOOTSTRAP=kafka:9092
      - MODEL_DIR=/models
      - TIER1_THRESHOLD=0.80
      - TIER2_THRESHOLD=0.65
      - TIER3_THRESHOLD=0.45
      - PYTHONPATH=/app/src
    volumes:
      - ./models:/models:rw
      - ./data:/data:rw
      - ./datasets:/app/datasets:ro
      - ./validation:/app/validation:ro
      - ./behavioral-engine/src:/app/src/aag_be:rw
    depends_on:
      ollama:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: ["/bin/bash", "-c"]
    command: |
      cd /app && pip install -e /app/datasets -e /app/validation -e . --quiet 2>/dev/null && python -m aag_be.api

  # ─── Deception Orchestrator ───
  deception-orchestrator:
    build:
      context: ./deception-orchestrator
      dockerfile: Dockerfile
    container_name: aag-deception-orchestrator
    ports:
      - "8001:8001"
      - "8080:8080"
    environment:
      - KAFKA_BOOTSTRAP=kafka:9092
      - POSTGRES_DSN=postgres://aag:aag@postgres:5432/aag
      - REDIS_URL=redis://redis:6379
      - PORT=8001
      - SWAGGER_PORT=8080
    volumes:
      - ./data:/data:rw
      - ./deception-orchestrator:/app:rw
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    entrypoint: ["/bin/bash", "-c"]
    command: |
      cd /app && go mod tidy && go build -o deception-orchestrator ./cmd/main.go && ./deception-orchestrator

  # ─── Agent Profiler ───
  agent-profiler:
    build:
      context: ./agent-profiler
      dockerfile: Dockerfile
    container_name: aag-agent-profiler
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_DSN=postgres://aag:aag@postgres:5432/aag
      - MODEL_DIR=/models
      - DEVICE=cpu
      - PYTHONPATH=/app/src
    volumes:
      - ./models:/models:rw
      - ./data:/data:rw
      - ./datasets:/app/datasets:ro
      - ./validation:/app/validation:ro
      - ./agent-profiler/src:/app/src/aag_profiler:rw
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: ["/bin/bash", "-c"]
    command: |
      cd /app && pip install -e /app/datasets -e /app/validation -e . --quiet 2>/dev/null && python -m aag_profiler.api

  # ─── LLM Judge ───
  llm-judge:
    build:
      context: ./behavioral-engine
      dockerfile: Dockerfile.llm-judge
    container_name: aag-llm-judge
    ports:
      - "8003:8003"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - MODEL=nemotron3-ultra:latest
      - PYTHONPATH=/app/src
    volumes:
      - ./models:/models:rw
      - ./behavioral-engine/src:/app/src/aag_be:rw
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    entrypoint: ["/bin/bash", "-c"]
    command: |
      cd /app && pip install -e . --quiet 2>/dev/null && python -m aag_be.llm_judge_api

  # ─── ClickHouse (Analytics) ───
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: aag-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=aag
      - CLICKHOUSE_USER=aag
      - CLICKHOUSE_PASSWORD=aag
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL + pgvector (Metadata & Embeddings) ───
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=aag
      - POSTGRES_USER=aag
      - POSTGRES_PASSWORD=aag
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aag -d aag"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka + Zookeeper (Event Streaming) ───
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: aag-zookeeper
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_logs:/var/lib/zookeeper/log

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: aag-kafka
    ports:
      - "9092:9092"
      - "9101:9101"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_JMX_PORT=9101
      - KAFKA_JMX_HOSTNAME=localhost
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_LOG_RETENTION_HOURS=168
      - KAFKA_LOG_SEGMENT_BYTES=1073741824
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ─── Ollama (LLM Inference) ───
  ollama:
    image: ollama/ollama:latest
    container_name: aag-ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Vector (Log Aggregation) ───
  vector:
    image: timberio/vector:0.38-alpine
    container_name: aag-vector
    ports:
      - "8686:8686"
      - "9001:9001"
    volumes:
      - ./infra/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - clickhouse
      - kafka
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ─── K3s (Kubernetes for Decoy Orchestration) ───
  k3s:
    image: rancher/k3s:v1.28.5-k3s1
    container_name: aag-k3s
    privileged: true
    environment:
      - K3S_TOKEN=aag-cluster-token
      - K3S_CLUSTER_INIT=true
    ports:
      - "6443:6443"
      - "8081:80"
      - "8443:443"
    volumes:
      - k3s_data:/var/lib/rancher/k3s
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G

  # ─── Dashboard (React Frontend) ───
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: aag-dashboard
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000/ws
    depends_on:
      - behavioral-engine
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ─── Grafana (Visualization) ───
  grafana:
    image: grafana/grafana:10.2.0
    container_name: aag-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aag
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - clickhouse
      - postgres
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ─── Redis (Caching) ───
  redis:
    image: redis:7-alpine
    container_name: aag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Initialization Service ───
  aag-init:
    build:
      context: .
      dockerfile: Dockerfile.init
    container_name: aag-init
    environment:
      - GENERATE_DATA=true
      - TRAIN_MODELS=true
      - RUN_VALIDATION=true
      - PULL_LLM=true
      - MODEL_DIR=/models
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./models:/models:rw
      - ./data:/data:rw
      - ./datasets:/app/datasets:ro
      - ./validation:/app/validation:ro
      - ./behavioral-engine:/app/behavioral-engine:ro
      - ./agent-profiler:/app/agent-profiler:ro
      - ./init.sh:/init.sh:ro
    depends_on:
      ollama:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 16G
    entrypoint: ["/bin/bash", "/init.sh"]
    restart: "no"

volumes:
  clickhouse_data:
  postgres_data:
  zookeeper_data:
  zookeeper_logs:
  kafka_data:
  ollama_data:
  k3s_data:
  grafana_data:
  redis_data:

networks:
  default:
    name: aag-network
    driver: bridge