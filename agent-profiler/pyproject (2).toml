[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aag-profiler"
version = "1.0.0"
description = "AAG Agent Profiler - Behavioral fingerprinting & agent family attribution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn==0.27.0",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "httpx==0.26.0",
    "sentence-transformers==3.0.0",
    "faiss-cpu==1.8.0",
    "torch==2.1.2",
    "numpy==1.26.2",
    "pyarrow==14.0.2",
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.12.1",
    "ruff==0.1.16",
    "mypy==1.7.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aag_profiler*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true