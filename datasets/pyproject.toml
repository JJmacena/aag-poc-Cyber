[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aag-datasets"
version = "1.0.0"
description = "AAG Dataset Generators - Benign, Red Team, CaaS, Adversarial"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.2",
    "pyarrow==14.0.2",
    "pandas==2.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "black==23.12.1",
    "ruff==0.1.16",
    "mypy==1.7.1",
]

[tool.setuptools.packages.find]
where = ["generate"]
include = ["datasets*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"