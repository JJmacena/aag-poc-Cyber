[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aag-validation"
version = "1.0.0"
description = "AAG Validation Pipeline - Metrics, Analysis, Reporting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.2",
    "pyarrow==14.0.2",
    "pandas==2.1.4",
    "scikit-learn==1.3.2",
    "scipy==1.11.4",
    "matplotlib==3.8.2",
    "seaborn==0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "black==23.12.1",
    "ruff==0.1.16",
    "mypy==1.7.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["validation*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"